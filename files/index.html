<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Página básica servida desde un contenedor Docker.">
		<title>Hola desde Docker</title>
		<style>
			:root {
				color-scheme: light;
				font-family: system-ui, sans-serif;
				background: #f3f6f4;
				color: #17231d;
			}

			body {
				display: grid;
				min-height: 100vh;
				margin: 0;
				place-items: center;
			}

			main {
				max-width: 36rem;
				padding: 2rem;
				text-align: center;
			}

			h1 {
				margin-bottom: 0.5rem;
				color: #176b4d;
			}

			p {
				line-height: 1.6;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Hola desde Docker</h1>
			<p>Esta página está servida por Nginx dentro de un contenedor.</p>
		</main>
	</body>
</html>
